# Página do IUNA no Modrinth. Este arquivo, as descrições e as imagens desta
# pasta são a fonte da página: o workflow "Modrinth" aplica tudo a cada push na
# main que mexa em modrinth/. O que muda no site e não está aqui é desfeito no
# próximo push.
#
# Fica de fora (só pelo site): status e visibilidade, aviso de IA, página
# Permissions, membros e monetização.
#
# Testar localmente, sem mudar nada: python3 scripts/modrinth.py sincronizar --simular

id = "vfStiAFv"
nome = "IUNA 2"
resumo = "A Brazilian Minecraft community made for friends — and yes, we ‘don’t have a name’."

# Até 3 principais. Lista: https://api.modrinth.com/v2/tag/category (project_type = modpack)
categorias = ["technology", "magic", "adventure"]
categorias_extras = ["kitchen-sink", "multiplayer", "combat"]

licenca = "MIT"
licenca_url = "https://github.com/IunaMC/modpack/blob/main/LICENSE"

# PNG ou JPEG quadrado, 256×256 ou maior.
icone = "imagens/icone.png"

# Deixe "" para não mostrar o link.
[links]
codigo = "https://github.com/IunaMC/modpack"
issues = "https://github.com/IunaMC/modpack/issues"
wiki = "https://wiki.iuna.club"
discord = ""

# A descrição da página é: o banner (se houver), o texto principal e a
# tradução num bloco recolhível. O "# Título" do topo de cada arquivo é tirado,
# porque o Modrinth já mostra o nome.
[descricao]
principal = "descricao.en.md"
traducao = "descricao.md"
traducao_titulo = "Português"
# Uma imagem da galeria (pelo arquivo) para abrir a descrição. "" para nenhuma.
banner = "imagens/banner.png"

# Galeria, na ordem. Cada imagem é reconhecida pelo conteúdo: trocar o arquivo
# envia a imagem nova e apaga a antiga. Até 5 MiB por imagem; nada gerado por IA.
[[galeria]]
arquivo = "imagens/banner.png"
titulo = "IUNA Mark II"
descricao = ""
destaque = true

# Mods que o .mrpack do Modrinth não leva, porque o autor não permite a
# redistribuição por lá (decisão 0007). O pack, o GitHub, a CurseForge e o
# servidor seguem completos. Cada um precisa estar citado nas duas descrições;
# o changelog de cada versão recebe o link do arquivo exato.
[[reduzido.fora]]
pw = "the-twilight-forest"
curseforge = "https://www.curseforge.com/minecraft/mc-mods/the-twilight-forest"

[[reduzido.fora]]
pw = "mob-grinding-utils"
curseforge = "https://www.curseforge.com/minecraft/mc-mods/mob-grinding-utils"
