name: Modrinth

# A página do projeto no Modrinth sai de modrinth/ (projeto.toml, descrições e
# imagens). Fora da main, só confere e mostra o que mudaria; na main, aplica.
on:
  push:
    paths: [modrinth/**, scripts/modrinth.py, .github/workflows/modrinth.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modrinth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pagina:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Conferir modrinth/
        run: python3 scripts/modrinth.py verificar

      - name: Mostrar o que mudaria na página
        if: github.ref != 'refs/heads/main'
        run: python3 scripts/modrinth.py sincronizar --simular

      - name: Atualizar a página
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/modrinth.py sincronizar
