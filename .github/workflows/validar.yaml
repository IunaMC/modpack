name: Validar

# Roda em todo push fora da main que mexe no pack: confere o índice e a lista
# de mods do README, gera um .mrpack de teste e sobe um servidor com o pack.
# O resultado aparece no PR da branch (sem pull_request, que duplicaria a execução).
on:
  push:
    branches-ignore: [main]
    paths: [pack/**, scripts/**, README.md, .github/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/packwiz

      - name: Conferir a lista de mods do README
        run: python3 scripts/pack.py readme --check

      # O servidor instala todo arquivo solto do pack; fora de config/yosbr/,
      # ele sobrescreveria as configs do minecraft-config.
      - name: Conferir os arquivos soltos do pack
        run: python3 scripts/pack.py soltos

      # O packwiz update só segue o Modrinth; isto acusa mod cujo arquivo na
      # CurseForge ficou para trás.
      - name: Conferir a fonte da CurseForge
        run: python3 scripts/curseforge.py verificar

      - name: Exportar o .zip da CurseForge
        id: zip
        run: |
          ZIP="IUNA-$(python3 scripts/pack.py versao)-${GITHUB_SHA::7}-curseforge.zip"
          echo "arquivo=$ZIP" >> "$GITHUB_OUTPUT"
          (cd pack && packwiz curseforge export -o ../"$ZIP")
          if unzip -l "$ZIP" 'overrides/mods/*' > /dev/null 2>&1; then
            echo "::error::O .zip da CurseForge tem jars em overrides/mods."
            exit 1
          fi

      - name: Exportar o .mrpack
        id: exportar
        run: |
          VERSAO="$(python3 scripts/pack.py versao)"
          ARQUIVO="IUNA-${VERSAO}-${GITHUB_SHA::7}.mrpack"
          (cd pack && packwiz mr export -o "../$ARQUIVO")
          echo "arquivo=$ARQUIVO" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.exportar.outputs.arquivo }}
          path: ${{ steps.exportar.outputs.arquivo }}
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.arquivo }}
          path: ${{ steps.zip.outputs.arquivo }}
          retention-days: 14
          compression-level: 0

  # Sobe um servidor NeoForge de verdade com os mods de servidor do pack,
  # instalados pelo packwiz-installer como na produção, e espera o "Done (".
  servidor:
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Com o secret MINECRAFT_CONFIG_TOKEN (leitura do repo privado
      # IunaMC/minecraft-config), o servidor sobe com as configs da main dele,
      # como na produção. Sem o secret, sobe só com os mods.
      - name: Subir o servidor
        env:
          GH_TOKEN: ${{ secrets.MINECRAFT_CONFIG_TOKEN }}
        run: |
          if [[ -n "$GH_TOKEN" ]]; then
            bash scripts/testar-servidor.sh --configs-git main "$RUNNER_TEMP/servidor"
          else
            echo "::warning::Sem o secret MINECRAFT_CONFIG_TOKEN: o servidor sobe sem as configs do minecraft-config."
            bash scripts/testar-servidor.sh "$RUNNER_TEMP/servidor"
          fi

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: servidor-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/servidor/servidor.log
            ${{ runner.temp }}/servidor/erros.log
            ${{ runner.temp }}/servidor/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
