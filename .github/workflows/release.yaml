name: Release

# Dispara quando o pack muda na main. Só publica se a versão do pack/pack.toml
# ainda não tiver release; senão, avisa e para. Também roda pela aba Actions.
on:
  push:
    branches: [main]
    paths: [pack/**, MUDANCAS.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ler e validar a versão
        id: versao
        run: |
          VERSAO="$(python3 scripts/pack.py versao)"
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=pack/pack.toml::Versão inválida: '$VERSAO' (esperado algo como 1.2.3 ou 1.2.3-beta.1)"
            exit 1
          fi
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSAO" >> "$GITHUB_OUTPUT"
          if [[ "$VERSAO" == *-* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$VERSAO" >/dev/null 2>&1; then
            echo "::warning::A release v$VERSAO já existe. Suba a versão no pack/pack.toml para publicar outra."
            echo "existe=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.versao.outputs.existe != 'true'
        uses: ./.github/actions/packwiz

      # O servidor instala pelo packwiz-installer, que baixa os mods do
      # CurseForge direto da fonte. Por isso os jars só de servidor
      # (server-overrides/, alguns All Rights Reserved) não vão no .mrpack
      # publicado: o arquivo leva só o que o jogador precisa.
      - name: Exportar o .mrpack
        if: steps.versao.outputs.existe != 'true'
        run: |
          ARQUIVO="IUNA-${{ steps.versao.outputs.versao }}.mrpack"
          (cd pack && packwiz mr export -o "../$ARQUIVO")
          if unzip -l "$ARQUIVO" 'server-overrides/*' > /dev/null 2>&1; then
            zip -q -d "$ARQUIVO" 'server-overrides/*'
          fi
          unzip -l "$ARQUIVO" | tail -1

      # Notas = MUDANCAS.md escrito à mão + lista de mods gerada pela
      # comparação com a release anterior.
      - name: Montar as notas da release
        if: steps.versao.outputs.existe != 'true'
        run: |
          ANTERIOR="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          {
            cat MUDANCAS.md
            if [[ -n "$ANTERIOR" ]]; then
              echo
              echo "## Mods desde $ANTERIOR"
              echo
              python3 scripts/pack.py mudancas "$ANTERIOR"
            fi
          } > "$RUNNER_TEMP/notas.md"
          cat "$RUNNER_TEMP/notas.md"

      - name: Criar tag e release
        if: steps.versao.outputs.existe != 'true'
        run: |
          gh release create "${{ steps.versao.outputs.tag }}" "IUNA-${{ steps.versao.outputs.versao }}.mrpack" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.versao.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/notas.md" \
            ${{ steps.versao.outputs.prerelease }}
