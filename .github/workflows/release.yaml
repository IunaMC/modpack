name: Release

# Dispara quando o pack muda na main ou na devel/devel. Versões estáveis
# (1.2.3) saem só da main e betas (1.2.3-beta.1), só da devel/devel: o servidor
# instala direto da main, então ela nunca pode ter beta. Só cria a release do
# GitHub se a versão do pack/pack.toml ainda não tiver uma; depois envia a
# versão ao Modrinth e à CurseForge, se ela ainda não estiver lá. Também roda
# pela aba Actions.
on:
  push:
    branches: [main, devel/devel]
    paths: [pack/**, MUDANCAS.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  versao:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      publicar: ${{ steps.versao.outputs.publicar }}
      versao: ${{ steps.versao.outputs.versao }}
      tag: ${{ steps.versao.outputs.tag }}
      prerelease: ${{ steps.versao.outputs.prerelease }}
      existe: ${{ steps.versao.outputs.existe }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ler e validar a versão
        id: versao
        env:
          ANTES: ${{ github.event.before }}
        run: |
          VERSAO="$(python3 scripts/pack.py versao)"
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=pack/pack.toml::Versão inválida: '$VERSAO' (esperado algo como 1.2.3 ou 1.2.3-beta.1)"
            exit 1
          fi
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSAO" >> "$GITHUB_OUTPUT"

          if [[ "$VERSAO" == *-* ]]; then
            if [[ "$GITHUB_REF_NAME" == main ]]; then
              echo "::error file=pack/pack.toml::A main só publica versões estáveis, e '$VERSAO' é beta. Betas saem da devel/devel."
              exit 1
            fi
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" != main ]]; then
            echo "::notice::$VERSAO não é beta, e versões estáveis só saem da main. Nada a publicar."
            exit 0
          fi
          echo "publicar=true" >> "$GITHUB_OUTPUT"

          # Alarme: as mesmas regras do workflow "Entrada na main", para o caso de
          # algo ter chegado à main sem passar por ele.
          if [[ "$GITHUB_REF_NAME" == main && "$GITHUB_EVENT_NAME" == push ]] \
            && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            python3 scripts/pack.py conferir "$ANTES" "$GITHUB_SHA"
          fi

          if gh release view "v$VERSAO" >/dev/null 2>&1; then
            # O servidor reinstala o pack da main a cada inicialização: mudar o
            # pack nela sem versão nova mudaria o servidor sem release.
            if [[ "$GITHUB_REF_NAME" == main && "$GITHUB_EVENT_NAME" == push ]] \
              && git cat-file -e "$ANTES^{commit}" 2>/dev/null \
              && ! git diff --quiet "$ANTES" "$GITHUB_SHA" -- pack/; then
              echo "::error file=pack/pack.toml::O pack mudou na main, mas a v$VERSAO já existe. Suba a versão no pack/pack.toml."
              exit 1
            fi
            echo "::warning::A release v$VERSAO já existe. Suba a versão no pack/pack.toml para publicar outra."
            echo "existe=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: versao
    if: needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/packwiz

      # O servidor instala pelo packwiz-installer, que baixa os mods do
      # CurseForge direto da fonte. Por isso os jars só de servidor
      # (server-overrides/, alguns All Rights Reserved) não vão no .mrpack
      # publicado: o arquivo leva só o que o jogador precisa.
      - name: Exportar o .mrpack
        if: needs.versao.outputs.existe != 'true'
        run: |
          ARQUIVO="IUNA-${{ needs.versao.outputs.versao }}.mrpack"
          (cd pack && packwiz mr export -o "../$ARQUIVO")
          if unzip -l "$ARQUIVO" 'server-overrides/*' > /dev/null 2>&1; then
            zip -q -d "$ARQUIVO" 'server-overrides/*'
          fi
          unzip -l "$ARQUIVO" | tail -1
          # Cópia com nome fixo: o GitHub só resolve releases/latest/download/<nome>
          # com o nome exato do asset, e o iuna.club/mrpack aponta para ela.
          cp "$ARQUIVO" IUNA.mrpack

      # O pack da CurseForge é o mesmo, com o Twilight Forest e o Mob Grinding
      # Utils, que o Modrinth não aceita. O .zip leva só os mods de cliente,
      # referenciados pela CurseForge. Fica na release ao lado do .mrpack e é o
      # que vai para a CurseForge.
      - name: Exportar o .zip da CurseForge
        run: |
          ARQUIVO="IUNA-${{ needs.versao.outputs.versao }}-curseforge.zip"
          (cd pack && packwiz curseforge export -o "../$ARQUIVO")
          if unzip -l "$ARQUIVO" 'overrides/mods/*' > /dev/null 2>&1; then
            echo "::error::O .zip da CurseForge tem jars em overrides/mods. Rode: python3 scripts/curseforge.py verificar"
            exit 1
          fi

      # Notas = MUDANCAS.md escrito à mão + lista de mods gerada pela
      # comparação com a release anterior.
      - name: Montar as notas da release
        if: needs.versao.outputs.existe != 'true'
        run: |
          # Versão estável compara com a estável anterior, não com as betas dela.
          if [[ -n "${{ needs.versao.outputs.prerelease }}" ]]; then
            ANTERIOR="$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -1)"
          else
            ANTERIOR="$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | head -1)"
          fi
          {
            cat MUDANCAS.md
            if [[ -n "$ANTERIOR" ]]; then
              echo
              echo "## Mods desde $ANTERIOR"
              echo
              python3 scripts/pack.py mudancas "$ANTERIOR"
            fi
          } > "$RUNNER_TEMP/notas.md"
          cat "$RUNNER_TEMP/notas.md"

      - name: Criar tag e release
        if: needs.versao.outputs.existe != 'true'
        run: |
          gh release create "${{ needs.versao.outputs.tag }}" "IUNA-${{ needs.versao.outputs.versao }}.mrpack" IUNA.mrpack \
            "IUNA-${{ needs.versao.outputs.versao }}-curseforge.zip" \
            --target "$GITHUB_SHA" \
            --title "${{ needs.versao.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/notas.md" \
            ${{ needs.versao.outputs.prerelease }}

      # Se a release já existia (ou o envio ao Modrinth falhou e o workflow foi
      # rodado de novo pela aba Actions), usa o .mrpack e as notas dela.
      - name: Baixar a release existente
        if: needs.versao.outputs.existe == 'true'
        run: |
          gh release download "${{ needs.versao.outputs.tag }}" -p '*.mrpack'
          gh release view "${{ needs.versao.outputs.tag }}" --json body -q .body > "$RUNNER_TEMP/notas.md"
          # Releases antigas não têm o .zip; --clobber evita asset duplicado.
          gh release upload "${{ needs.versao.outputs.tag }}" \
            "IUNA-${{ needs.versao.outputs.versao }}-curseforge.zip" --clobber

      # O Modrinth recebe o .mrpack reduzido, sem os mods de [[reduzido.fora]]
      # do modrinth/projeto.toml (decisão 0007). Ele sai do completo, então
      # funciona também com o .mrpack baixado da release existente, e não vai
      # para a release do GitHub. Pula sozinho se a versão já estiver no
      # Modrinth ou se o secret MODRINTH_TOKEN não existir.
      - name: Publicar no Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          python3 scripts/modrinth.py reduzir "IUNA-$VERSAO.mrpack" "IUNA-$VERSAO-modrinth.mrpack"
          python3 scripts/modrinth.py publicar "$VERSAO" \
            "IUNA-$VERSAO-modrinth.mrpack" "$RUNNER_TEMP/notas.md"

      # Envia o .zip exportado acima. Pula sozinho se a versão já estiver lá ou
      # se faltar o secret CURSEFORGE_TOKEN ou a variable CURSEFORGE_PROJECT_ID.
      - name: Publicar na CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          python3 scripts/curseforge.py publicar "${{ needs.versao.outputs.versao }}" \
            "IUNA-${{ needs.versao.outputs.versao }}-curseforge.zip" "$RUNNER_TEMP/notas.md"

  # A release sai com o GITHUB_TOKEN, que não dispara o evento release: o aviso
  # é chamado daqui. Falha no Discord não derruba o Release (ver o workflow).
  avisar:
    needs: [versao, release]
    if: needs.versao.outputs.publicar == 'true' && needs.versao.outputs.existe != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/discord-releases.yaml
    with:
      tag: ${{ needs.versao.outputs.tag }}
    secrets: inherit
