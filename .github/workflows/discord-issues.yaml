name: Discord · issues

# Avisa no canal de issues do Discord quando uma issue é aberta, fechada ou reaberta.
# O webhook fica no secret DISCORD_WEBHOOK_ISSUES; sem ele o workflow pula sozinho.
on:
  issues:
    types: [opened, closed, reopened]

permissions:
  issues: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar no Discord
        env:
          DISCORD_WEBHOOK_ISSUES: ${{ secrets.DISCORD_WEBHOOK_ISSUES }}
        run: |
          [ -n "$DISCORD_WEBHOOK_ISSUES" ] || exit 0
          jq '
            .issue as $i
            | .action as $action
            | .repository as $repo
            | {
                username: "IUNA · issues",
                allowed_mentions: {parse: []},
                embeds: [{
                  color: (if $action == "opened" then 15105570 elif $action == "closed" then 9807270 else 3447003 end),
                  author: {name: $i.user.login, icon_url: $i.user.avatar_url, url: $i.user.html_url},
                  title: "#\($i.number): \($i.title | .[:200])",
                  url: $i.html_url,
                  description: (($i.body // "") | .[:300]),
                  footer: {text: "\($repo.full_name) · \(if $action == "opened" then "aberta" elif $action == "closed" then "fechada" else "reaberta" end)"}
                }]
              }' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/embed.json"
          curl -fsS -H 'Content-Type: application/json' \
            -d @"$RUNNER_TEMP/embed.json" "$DISCORD_WEBHOOK_ISSUES"
