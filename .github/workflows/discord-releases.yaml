name: Discord · releases

# Avisa no canal de releases do Discord que uma release saiu. O workflow Release
# chama este (workflow_call) depois de publicar, porque a release sai com o
# GITHUB_TOKEN, que não dispara o evento release. O gatilho release cobre a
# release publicada à mão. O webhook fica no secret DISCORD_WEBHOOK_RELEASE; sem
# ele o workflow pula sozinho, e falha no Discord não derruba o Release.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag da release a anunciar
        type: string
        required: true

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar no Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_RELEASE: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          [ -n "$DISCORD_WEBHOOK_RELEASE" ] || exit 0
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,body,author,isPrerelease > "$RUNNER_TEMP/release.json"
          jq --arg repo "${GITHUB_REPOSITORY#*/}" '
            . as $r
            | ($r.author.login | sub("\\[bot\\]$"; "")) as $nome
            | (if ($r.author.login | endswith("[bot]")) then "https://github.com/apps/\($nome)" else "https://github.com/\($nome)" end) as $perfil
            | {
                username: "IUNA · releases",
                allowed_mentions: {parse: []},
                embeds: [{
                  color: (if $r.isPrerelease then 15105570 else 5763719 end),
                  author: {
                    name: $r.author.login,
                    icon_url: "\($perfil).png",
                    url: $perfil
                  },
                  title: "\($repo) \($r.tagName)",
                  url: $r.url,
                  description: (($r.body // "")
                    | gsub("(?m)^#{1,6} +(?<t>.+)$"; "**\(.t)**")
                    | .[:3500])
                }]
              }' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/embed.json"
          curl -fsS -H 'Content-Type: application/json' \
            -d @"$RUNNER_TEMP/embed.json" "$DISCORD_WEBHOOK_RELEASE"
